[package]
name = "eskiz-format"
description = "Reader and writer for the .procreate file format"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
plist = "1.10.1"
thiserror = "2.0.21"
zip = { version = "9.0.3", default-features = false, features = ["deflate"] }
png = "0.18.1"
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
tiff = "0.11"
pdf-writer = "0.15.0"
flate2 = "1.1.10"
# Colour spaces and the primaries the ICC profiles are generated from.
eskiz-guides = { path = "../eskiz-guides" }

[dev-dependencies]
lopdf = "0.45.0"
psd = "0.3.5"
