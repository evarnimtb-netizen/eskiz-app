[package]
name = "eskiz-core"
description = "CPU brush engine: input geometry, brush settings, dab rasteriser and layer compositing."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
eskiz-filters = { path = "../eskiz-filters" }
# Colour spaces (sRGB, Display P3) and the conversion between them, and the text-layer data
# that `Document::texts` keeps.
eskiz-types = { path = "../eskiz-types" }
# Safe byte views of 16-bit tile storage.
bytemuck = { version = "1", features = ["extern_crate_alloc"] }
