[package]
name = "eskiz-text"
description = "Text layers: attributed runs, font library with fallback, cosmic-text layout, premultiplied RGBA8 rasterisation and attribute storage keys."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
# The text-layer data (`TextLayer`, `Attrs`, ...) lives in the leaf crate; `model` re-exports it.
eskiz-types = { path = "../eskiz-types" }
cosmic-text = "0.19.0"
swash = "0.2.10"
thiserror = "2.0.21"
