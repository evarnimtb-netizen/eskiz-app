name: Release

# Builds the downloadable packages and, for a version tag, creates a DRAFT GitHub release. Nothing is
# published until a maintainer reviews the draft and presses "Publish release".
#
#   - push a tag `vX.Y.Z` (it must match the version in Cargo.toml), or a release-candidate tag
#     `vX.Y.Z-rcN` (same version; the release is marked as a pre-release), or
#   - run it by hand (Actions tab, "Run workflow"). A manual run is a dry run unless you untick the
#     box; a dry run builds everything and uploads the files as workflow artifacts only.
#
# All packages are unsigned or self-signed (see README): macOS is ad-hoc signed, Windows is not signed,
# and the Android APK is signed with the public debug key and is experimental.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Dry run (build and upload artifacts, but create no release)
        type: boolean
        default: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # appimagetool is downloaded once, from a versioned release, and checked before it is run.
  APPIMAGETOOL_VERSION: "1.9.1"
  APPIMAGETOOL_SHA256: "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0"

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: v
        name: Read the version; a tag must match it
        run: |
          version=$(awk -F'"' '/^version = /{print $2; exit}' Cargo.toml)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          tag="v$version"; prerelease=false
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            case "$GITHUB_REF_NAME" in
              "v$version") ;;
              "v$version"-rc[0-9]*) prerelease=true ;;
              *) echo "tag $GITHUB_REF_NAME does not match Cargo.toml version v$version (or v$version-rcN)" >&2; exit 1 ;;
            esac
            tag="$GITHUB_REF_NAME"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          grep -q "^## \[$version\]" CHANGELOG.md || { echo "CHANGELOG.md has no section for $version" >&2; exit 1; }

  macos:
    needs: check-version
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust toolchain with both Apple targets
        run: |
          rustup toolchain install
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: false
      - name: Universal .app (ad-hoc signed) and DMG
        run: ./packaging/macos/build.sh
      - name: Notices are in the package
        run: tools/check_notices.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-dmg
          path: dist/release/*.dmg
          if-no-files-found: error

  windows:
    needs: check-version
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: false
      - name: x86_64 (MSVC) release build, self-test, zip
        shell: pwsh
        run: ./packaging/windows/build.ps1
      - name: The exe has no Visual C++ runtime imports (static CRT)
        shell: pwsh
        run: |
          python packaging/windows/test_check_imports.py
          python packaging/windows/check-imports.py target/x86_64-pc-windows-msvc/release/eskiz.exe --list
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-zip
          path: dist/release/*.zip
          if-no-files-found: error

  linux:
    needs: check-version
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: false
      - name: Linux system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-0 libgl1-mesa-dev libwayland-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev fonts-dejavu-core mesa-vulkan-drivers xvfb
      # Built against glibc 2.28 so the binary runs on older distributions.
      - uses: goto-bus-stop/setup-zig@abea47f85e598557f500fa1fd2ab7464fcb39406 # v2.2.1
        with:
          version: 0.17.0
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-zigbuild@0.23.4
      - name: Build x86_64 (glibc 2.28)
        run: cargo zigbuild --release --locked -p eskiz-app --target x86_64-unknown-linux-gnu.2.28
      - name: Self-test
        run: xvfb-run -a ./target/x86_64-unknown-linux-gnu/release/eskiz --selftest
      - name: Download appimagetool (pinned version, SHA-256 checked)
        run: |
          url="https://github.com/AppImage/appimagetool/releases/download/${APPIMAGETOOL_VERSION}/appimagetool-x86_64.AppImage"
          curl -fsSL -o "$RUNNER_TEMP/appimagetool" "$url"
          echo "${APPIMAGETOOL_SHA256}  $RUNNER_TEMP/appimagetool" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/appimagetool"
      - name: AppDir, AppImage and tarball
        env:
          APPIMAGETOOL: ${{ runner.temp }}/appimagetool
          # Runners have no FUSE, so appimagetool must extract itself to run.
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: ./packaging/linux/build-appimage.sh
      - name: Notices are in the packages
        run: tools/check_notices.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-packages
          path: |
            dist/release/*.AppImage
            dist/release/*.tar.gz
          if-no-files-found: error

  android:
    # Experimental: arm64 only, signed with the public debug key (installable by sideloading, not for stores).
    needs: check-version
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust toolchain with the Android target
        run: |
          rustup toolchain install
          rustup target add aarch64-linux-android
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - name: Android SDK platform and NDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;30.0.16248370"
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-ndk@4.1.2
      - name: Build the arm64 APK (release profile, debug key)
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease -Peskiz.abis=arm64-v8a
      - name: Name the APK
        run: |
          version=$(awk -F'"' '/^version = /{print $2; exit}' Cargo.toml)
          mkdir -p dist/release
          apk=$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)
          cp "$apk" "dist/release/Eskiz-${version}-android-arm64-experimental.apk"
      - name: Notices are in the APK
        run: tools/check_notices.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-package
          path: dist/release/*.apk
          if-no-files-found: error

  release:
    needs: [check-version, macos, windows, linux, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # only to create the draft release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release-files
          merge-multiple: true
      - name: Checksums
        working-directory: release-files
        run: |
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - name: Release notes from CHANGELOG.md
        env:
          VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          # The section "## [VERSION] ..." up to the next "## [" heading.
          awk -v v="$VERSION" '
            /^## \[/ { if (found) exit; if (index($0, "## [" v "]") == 1) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > release-notes.md
          [ -s release-notes.md ] || { echo "empty release notes for $VERSION" >&2; exit 1; }
          cat >> release-notes.md <<'NOTES'

          These builds are not code-signed. See "Install" in the README for how to open them on your system.
          Windows: extract the whole zip first (Extract All), then run eskiz.exe; if SmartScreen says "Windows protected your PC", choose More info, then Run anyway. If nothing appears at all, Windows 11 Smart App Control may be blocking the unsigned app (no override; turn it off in Windows Security > App & browser control). Otherwise, `%LOCALAPPDATA%\Eskiz\logs` explains why.
          The Android APK is experimental. Verify downloads with `SHA256SUMS`.
          NOTES
          cat release-notes.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-bundle
          path: |
            release-files/*
            release-notes.md
          if-no-files-found: error
      - name: Create the draft release
        if: github.event_name == 'push' || inputs.dry_run == false
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check-version.outputs.version }}
          TAG: ${{ needs.check-version.outputs.tag }}
          PRERELEASE: ${{ needs.check-version.outputs.prerelease }}
        run: |
          title="Eskiz $VERSION"; extra=""
          if [ "$PRERELEASE" = true ]; then
            title="Eskiz $VERSION (release candidate ${TAG##*-rc})"
            extra="--prerelease"
          fi
          gh release create "$TAG" release-files/* \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$title" --notes-file release-notes.md --draft $extra
      - name: Dry run summary
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: |
          echo "Dry run, no release was created. The files are in the release-bundle artifact." >> "$GITHUB_STEP_SUMMARY"
