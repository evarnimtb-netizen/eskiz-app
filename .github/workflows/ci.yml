name: CI

# GitHub-hosted runners only. Nothing here uses secrets or a private machine, so pull requests
# from forks are safe to run.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The toolchain version comes from rust-toolchain.toml.
      - name: Rust toolchain
        shell: bash
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
        with:
          # Saving several GB of target/ from pull requests is slow and can fill the runner disk.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-0 libgl1-mesa-dev libwayland-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev fonts-dejavu-core mesa-vulkan-drivers xvfb
      - name: Test
        run: cargo test --workspace --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Release build
        run: cargo build --release -p eskiz-app --locked
      - name: Self-test (Linux, software Vulkan under Xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a ./target/release/eskiz --selftest
      - name: Self-test (macOS)
        if: runner.os == 'macOS'
        run: ./target/release/eskiz --selftest
      - name: Self-test (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: ./target/release/eskiz.exe --selftest

  licenses:
    name: cargo deny (licenses)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-deny@0.19.0
      - name: Check licenses
        run: cargo deny check licenses
