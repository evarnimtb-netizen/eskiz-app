name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report this! Fill in what you can; it is fine to leave fields
        empty if you are not sure. This page is public, so only attach pictures you are happy to share.
        For security problems, do not use this form: see SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Eskiz version
      description: The number in the file name you downloaded (for example 0.1.0), or in Actions > Help > About.
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Windows
        - Linux
        - Android (experimental)
        - Other
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: System version and computer
      placeholder: e.g. macOS 15 on a MacBook Air, Windows 10 laptop, Ubuntu 24.04
    validations:
      required: false
  - type: input
    id: gpu
    attributes:
      label: Graphics card (optional)
      description: Only if you know it. Developers can run `eskiz --diagnose` for a summary to paste below.
      placeholder: e.g. Apple M2, NVIDIA RTX 3060, Intel UHD 620
    validations:
      required: false
  - type: input
    id: input-device
    attributes:
      label: Pen or tablet (optional)
      description: For example "Wacom Intuos" or "iPad with Apple Pencil through Sidecar". Leave empty if you use a mouse or touchpad.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      placeholder: e.g. I pressed Undo and the whole layer disappeared. I expected only the last stroke to go.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How can we see it happen? (optional)
      description: The steps that lead to the problem, if you know them.
      placeholder: |
        1. Make a new canvas
        2. Choose the Graphite brush
        3. ...
    validations:
      required: false
  - type: textarea
    id: extra
    attributes:
      label: Screenshots, logs or a small file (optional)
      description: Drag files into this box. On Windows, the start-up logs are in %LOCALAPPDATA%\Eskiz\logs. Only share files you are allowed to share.
