[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT OR Apache-2.0"

[profile.release]
opt-level = 3

# Painting and the headless snapshot renderer are pixel loops; unoptimised they make the
# test suite slow. Light optimisation keeps debug builds debuggable.
[profile.dev]
opt-level = 1
# Line tables keep file:line in panics and backtraces but skip full debug info:
# noticeably faster debug/test builds and much smaller target/ directories.
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
